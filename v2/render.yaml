# render.yaml — Render Blueprint for Scissors API v2
# Docs: https://render.com/docs/blueprint-spec
#
# ⚠️  Redis on the Render free tier:
#     Render does NOT offer Redis on its free plan. Options:
#     - Upstash Redis free tier  → https://upstash.com  (10 000 cmd/day)
#     - Redis Cloud free tier    → https://redis.io/cloud  (30 MB)
#     Set the REDIS_URL environment variable to the external URL.
#     The app degrades gracefully (cache misses fall back to the DB) if
#     Redis is unreachable, so it still works — just without caching.
#
# ⚠️  PostgreSQL on the Render free tier:
#     Free PostgreSQL databases expire after 90 days. Upgrade to a paid
#     instance for production use.

services:
  - type: web
    name: scissors-api-v2
    runtime: docker
    rootDir: v2
    dockerfilePath: ./Dockerfile
    plan: free          # Change to 'starter' or higher to avoid spin-down
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DEBUG
        value: "false"
      - key: WORKERS
        value: "1"        # Free tier has limited RAM; use 1 worker
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scissors-db
          property: connectionString
      - key: REDIS_URL
        sync: false       # Set manually in the Render dashboard
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: GEOIPIFY_API_KEY
        value: ""

databases:
  - name: scissors-db
    databaseName: scissors
    user: scissors
    plan: free            # Free Postgres — expires after 90 days
